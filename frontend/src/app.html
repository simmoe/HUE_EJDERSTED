<!doctype html>
<html lang="da">
	<head>
		<meta charset="utf-8" />
		<script>
			(function () {
				var el = document.documentElement;
				var baked = el.getAttribute('data-hue-site');
				if (baked === 'home' || baked === 'garden') return;
				var host = location.hostname;
				var garden =
					host === '192.168.8.133' ||
					host === '100.111.167.54' ||
					/kolonihave/i.test(host);
				el.setAttribute('data-hue-site', garden ? 'garden' : 'home');
			})();
		</script>
		<style>
			#hue-boot-splash {
				position: fixed;
				inset: 0;
				z-index: 10000;
				background: #000;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				-webkit-tap-highlight-color: transparent;
			}
			html[data-hue-site='garden'] #hue-boot-splash {
				background: #fff;
			}
			#hue-boot-splash .mark-garden,
			#hue-boot-splash .mark-home-stack {
				display: none;
			}
			html[data-hue-site='garden'] #hue-boot-splash .mark-garden {
				display: block;
				width: min(420px, 72vw);
				height: auto;
			}
			html[data-hue-site='home'] #hue-boot-splash .mark-home-stack,
			html:not([data-hue-site]) #hue-boot-splash .mark-home-stack {
				display: flex;
				flex-direction: column;
				align-items: stretch;
				width: min(240px, 42vw);
				gap: 18px;
			}
			#hue-boot-splash .mark-home {
				width: 100%;
				aspect-ratio: 1;
				background: #060daa;
				-webkit-mask: url(/ejdersted-mark.png) center / contain no-repeat;
				mask: url(/ejdersted-mark.png) center / contain no-repeat;
				-webkit-mask-mode: luminance;
				mask-mode: luminance;
			}
			#hue-boot-splash .mark-word {
				display: block;
				width: 100%;
				height: auto;
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="theme-color" content="#000000" />
		<title>Haven</title>
		<meta name="application-name" content="Haven" />
		<meta name="apple-mobile-web-app-title" content="Haven" />
		<link rel="apple-touch-icon" href="/haven-icon-v4.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/haven-icon-v4.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=4" />
		<link rel="shortcut icon" href="/favicon.ico?v=4" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@200&family=Roboto:wght@100;300&display=swap" rel="stylesheet" />
		<!-- Spotify SDK: callback SKAL findes før script indlæses (ellers AnthemError). -->
		<script>
			window.onSpotifyWebPlaybackSDKReady = function () {
				window.__ejderstedSpotifySdkReady = true;
			};
		</script>
		<script src="https://sdk.scdn.co/spotify-player.js"></script>
		<script>
			if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
				crypto.randomUUID = function () {
					return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
						return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
					});
				};
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="hue-boot-splash" role="button" tabindex="0">
			<img class="mark-garden" src="/web-app-manifest-512x512.png" alt="haven" />
			<div class="mark-home-stack">
				<div class="mark-home" role="img" aria-label="Ejdersted"></div>
				<svg class="mark-word" viewBox="0 0 1000 110" role="img" aria-label="Ejderstedgade">
					<text x="0" y="82" textLength="1000" lengthAdjust="spacing" fill="#060daa" font-family="Lexend Deca, Roboto, sans-serif" font-weight="200" font-size="72">EJDERSTEDGADE</text>
				</svg>
			</div>
		</div>
		<script>
			(function () {
				var boot = document.getElementById('hue-boot-splash');
				if (!boot) return;
				var leave = function () {
					boot.remove();
					document.documentElement.setAttribute('data-hue-splash-off', '');
				};
				boot.addEventListener('click', leave);
				boot.addEventListener('keydown', function (e) {
					if (e.key === 'Enter' || e.key === ' ') leave();
				});
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				if (!('serviceWorker' in navigator)) return;
				// Kiosken er online på LAN; undgå service-worker updates, der kan føles som reloads.
				navigator.serviceWorker.getRegistrations().then(function (rs) {
					rs.forEach(function (r) {
						r.unregister();
					});
				});
			})();
		</script>
	</body>
</html>
